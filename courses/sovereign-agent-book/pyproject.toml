[project]
name = "sovereign-agent-book-course"
version = "2026.9.28"
description = "Exercises, solutions, educator guides and chapter code for Build Your Always-On AI Agent From Scratch (profrod.ai/book)."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  # Every chapter builds on the learner's own code; the finished agent is not a dependency.
  "pydantic>=2,<3",
]

[dependency-groups]
course = [
  "ipykernel==7.3.0",
  "jupytext==1.19.5",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
]

[tool.uv]
package = false
default-groups = ["course"]
