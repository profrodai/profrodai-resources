[project]
name = "sovereign-agent-book-course"
version = "2026.9.28"
description = "Exercises, solutions, educator guides and chapter code for Build Your Always-On AI Agent From Scratch (profrod.ai/book)."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  # The finished agent the chapters build toward, pinned to the commit that runs on Python 3.12,
  # Colab's version (sovereign-agent#134), until a PyPI release carries it.
  "sovereign-agent @ git+https://github.com/profrodai/sovereign-agent@100c01a1ffa3e0fe031e1483282718f61817c363",
  "pydantic>=2,<3",
]

[dependency-groups]
course = [
  "ipykernel==7.3.0",
  "jupytext==1.19.5",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
]

[tool.uv]
package = false
default-groups = ["course"]
