name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: courses/agentic-coding-with-cursor/order-api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: make verify
