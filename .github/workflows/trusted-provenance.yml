name: verify-trusted-provenance

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Explicit main checkout keeps manual dispatch from running a caller-selected ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: courses/agentic-coding-with-cursor/order-api/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Fetch pinned private profrod-site source object
        env:
          PROFROD_SITE_READ_TOKEN: ${{ secrets.PROFROD_SITE_READ_TOKEN }}
        run: |
          test -n "$PROFROD_SITE_READ_TOKEN" || { echo "required source-read token is unavailable"; exit 1; }
          source_url="https://x-access-token:${PROFROD_SITE_READ_TOKEN}@github.com/rodriveracom/profrod-site.git"
          git -c credential.helper= clone --no-checkout "$source_url" _source/profrod-site
          git -C _source/profrod-site fetch --depth=1 "$source_url" db4dc3afb65aa402069d04533d4ce9766d7444e4
          git -C _source/profrod-site remote set-url origin https://github.com/rodriveracom/profrod-site.git
          unset PROFROD_SITE_READ_TOKEN source_url
          git -C _source/profrod-site checkout --detach db4dc3afb65aa402069d04533d4ce9766d7444e4
      - run: PROFROD_SITE_REPO="$PWD/_source/profrod-site" make verify
